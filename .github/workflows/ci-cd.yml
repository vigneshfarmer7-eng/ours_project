name: AutoDeploy Hub CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          echo "Building backend..."
          docker build -t autodeploy-backend:latest ./backend

      - name: Build frontend Docker image
        run: |
          echo "Building frontend..."
          docker build -t autodeploy-frontend:latest .

      - name: Start services with Docker Compose
        run: |
          echo "Starting services..."
          docker-compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend to be healthy..."
          timeout 60 sh -c 'until docker inspect --format="{{.State.Health.Status}}" autodeploy-backend | grep -q "healthy"; do sleep 2; done'
          
          echo "Waiting for frontend to be healthy..."
          timeout 60 sh -c 'until docker inspect --format="{{.State.Health.Status}}" autodeploy-frontend | grep -q "healthy"; do sleep 2; done'
          
          echo "All services are healthy!"

      - name: Test backend health endpoint
        run: |
          echo "Testing backend /health endpoint..."
          response=$(curl -s http://localhost:5000/health)
          echo "Response: $response"
          
          status=$(echo $response | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "Backend health check failed!"
            exit 1
          fi
          echo "Backend health check passed!"

      - name: Test frontend accessibility
        run: |
          echo "Testing frontend accessibility..."
          http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          
          if [ "$http_code" != "200" ]; then
            echo "Frontend is not accessible! HTTP code: $http_code"
            exit 1
          fi
          echo "Frontend is accessible!"

      - name: Show container logs
        if: always()
        run: |
          echo "=== Backend Logs ==="
          docker-compose logs backend
          echo "=== Frontend Logs ==="
          docker-compose logs frontend

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping services..."
          docker-compose down -v
          echo "Cleanup complete!"
